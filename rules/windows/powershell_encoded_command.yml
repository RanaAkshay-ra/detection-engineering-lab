title: PowerShell Encoded Command Execution
id: 5747b9d6-09d8-4de5-9568-cdb89b53c092
status: experimental
description: Detects PowerShell execution using encoded command arguments for detection testing.
author: Akshay Rana
date: 2026-10-01

logsource:
    category: process_creation
    product: windows

detection:
    selection_image:
        Image|endswith: '\powershell.exe'

    selection_command:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc'

    condition: selection_image and selection_command

falsepositives:
    - Legitimate administrative PowerShell scripts using encoded commands

level: medium

tags:
    - attack.execution
    - attack.t1059.001